packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": true
  esbuild: true
  msgpackr-extract: true
  prisma: true

autoInstallPeers: false
engineStrict: true
injectWorkspacePackages: true
strictPeerDependencies: true

peerDependencyRules:
  ignoreMissing:
    - react
    - react-dom
